services:
  # ============================================================
  # Backend Django (existant – avec Docker)
  # ============================================================
  - type: web
    name: cimetiere-backend
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cimetiere-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com

  # ============================================================
  # Frontend Flet (nouveau – déploiement Python)
  # ============================================================
  - type: web
    name: cimetiere-frontend
    env: python
    buildCommand: |
      pip install -r requirements.txt
    startCommand: flet-web --port 10000 frontend.main
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0